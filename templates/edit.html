<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşlem Düzenle - Mert Finans</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💵</text></svg>">
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .edit-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 440px;
        }

        .header {
            border-bottom: 2px solid #2563eb;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h3 {
            font-size: 18px;
            font-weight: 800;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 13px;
            color: #0f172a;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-delete {
            width: 100%;
            padding: 11px;
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            display: block;
            margin-top: 10px;
            transition: all 0.15s ease;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        .btn-back {
            display: block;
            text-align: center;
            color: #64748b;
            margin-top: 15px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-back:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="edit-card">
        <div class="header">
            <h3>✏️ İşlem Düzenle</h3>
            <span style="font-size: 11px; font-weight: 700; background: #e2e8f0; padding: 3px 8px; border-radius: 4px;">#{{ islem.id }}</span>
        </div>

        <form method="POST">
            <div class="input-group">
                <label>İşlem Açıklaması:</label>
                <input type="text" name="baslik" value="{{ islem.baslik if islem.baslik and islem.baslik != 'Açıklamasız İşlem' else '' }}" placeholder="Açıklama giriniz...">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>Miktar (TL):</label>
                    <input type="number" step="0.01" name="miktar" value="{{ islem.miktar }}" required>
                </div>
                
                <div class="input-group">
                    <label>İşlem Türü:</label>
                    <select name="tip">
                        <option value="gider" {% if islem.tip == 'gider' %}selected{% endif %}>Gider (-)</option>
                        <option value="gelir" {% if islem.tip == 'gelir' %}selected{% endif %}>Gelir (+)</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label>Kategori:</label>
                <select name="kategori">
                    {% for k in kategoriler %}
                    <option value="{{ k.ad }}" {% if islem.kategori == k.ad %}selected{% endif %}>{{ k.ad }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="input-group">
                <label>Tarih:</label>
                <input type="date" name="tarih" value="{{ islem.tarih.strftime('%Y-%m-%d') }}">
            </div>
            
            <button type="submit" class="btn-submit">💾 Değişiklikleri Kaydet</button>
        </form>

        <a href="/sil/{{ islem.id }}" class="btn-delete" onclick="return confirm('Bu işlem kalıcı olarak silinecektir! Emin misiniz?')">🗑️ İşlemi Tamamen Sil</a>
        <a href="/user_detail/{{ islem.user_id }}" class="btn-back">← Panele Geri Dön</a>
    </div>
</body>
</html>
